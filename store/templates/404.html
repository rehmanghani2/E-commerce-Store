<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | ToolNest Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#0f172a;color:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .card{background:#1e293b;border:1px solid #334155;border-radius:1rem;padding:48px 36px;max-width:480px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.3)}
  .badge{display:inline-block;background:#0284c7;color:#fff;font-family:monospace;font-size:1.25rem;font-weight:700;padding:6px 16px;border-radius:99px;margin-bottom:20px}
  h1{font-size:2rem;font-weight:800;margin-bottom:12px;letter-spacing:-.02em}
  p{color:#94a3b8;font-size:.95rem;line-height:1.6;margin-bottom:28px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#006194;color:#fff;font-weight:600;padding:12px 24px;border-radius:.5rem;text-decoration:none;transition:all .15s}
  .btn:hover{background:#004b73;transform:translateY(-1px)}
</style>
</head>
<body>
<div class="card">
  <div class="badge">ERROR 404</div>
  <h1>Page Not Found</h1>
  <p>The hardware catalog page or resource you are looking for doesn't exist or has been moved.</p>
  <a href="/" class="btn">Return to ToolNest Store →</a>
</div>
</body>
</html>
