app = "e-commerce-store-yjdr6g"
primary_region = "ams"

[build]
  builder = "heroku/buildpacks:20"

[env]
  PORT = "8000"
  PYTHON_VERSION = "3.10.12"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/"
